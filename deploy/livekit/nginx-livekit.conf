# Nginx site for LiveKit signaling (WSS).
# Media (UDP 50000-60000 and TCP 7881) bypasses Nginx — open those on the firewall.
#
# 1. Replace livekit.YOUR_DOMAIN with your DNS name
# 2. sudo ln -s /etc/nginx/sites-available/livekit /etc/nginx/sites-enabled/
# 3. Obtain TLS: sudo certbot --nginx -d livekit.YOUR_DOMAIN
# 4. sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect (Certbot may manage this after first run)
server {
    listen 80;
    listen [::]:80;
    server_name livekit.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livekit.YOUR_DOMAIN;

    # Certbot will fill these paths; placeholders until first certbot run:
    # ssl_certificate     /etc/letsencrypt/live/livekit.YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/livekit.YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Long-lived WebSocket for LiveKit signaling
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
